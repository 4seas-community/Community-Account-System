services:
  cas:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/cas.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - CHECKIN_SECRET=${CHECKIN_SECRET:-dev-checkin-secret}
      - ADMIN_KEY=${ADMIN_KEY:-dev-admin-key}
      - EMAIL_BACKEND=console
    volumes:
      - cas-data:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  cas-data:
