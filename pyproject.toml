[project]
name = "community-account-system"
version = "0.1.0"
description = "Community Account System (CAS) - unified identity, points ledger, check-in tokens for the 4Seas ecosystem"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.services"]

[tool.ruff.lint]
# B008 is the idiomatic FastAPI dependency-injection pattern.
ignore = ["B008"]
